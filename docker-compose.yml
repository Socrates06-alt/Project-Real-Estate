# Local development: database + API + web app.
#   docker compose up --build        -> open http://localhost:5173
#   docker compose exec api python -m scripts.seed_demo   (optional sample listings)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nilayam
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: pg_isready -U postgres
      interval: 2s
      retries: 20

  api:
    build: ./backend
    user: root
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/nilayam
      SUPABASE_JWT_SECRET: local-dev-secret-change-me-0123456789abcdef
      LOCAL_MEDIA_DIR: /data/media
      CONTACT_PHONE: "+919999999999"
      CONTACT_WHATSAPP: "+919999999999"
    volumes:
      - media:/data/media
      - ./backend/scripts:/app/scripts
    command: sh -c "python -m app.db && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]

  web:
    image: node:22-alpine
    working_dir: /app
    depends_on: [api]
    environment:
      API_PROXY: http://api:8000
    volumes:
      - ./frontend:/app
      - web_modules:/app/node_modules
    command: sh -c "npm ci && npx vite --port 5173"
    ports: ["5173:5173"]

volumes:
  dbdata:
  media:
  web_modules:
