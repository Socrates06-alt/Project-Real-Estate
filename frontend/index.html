<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="LandFinder — Find it. Trust it. Every property, personally verified." />
    <meta name="theme-color" content="#2e3a8c" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>LandFinder · Find it. Trust it.</title>
    <script>
      // Light by default; apply dark before the page paints if the user chose it.
      try {
        var t = localStorage.getItem("nilayam.theme");
        if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- Indigo splash: shown instantly, faded out once the app is ready -->
    <div id="splash" style="position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#2e3a8c;transition:opacity .35s ease">
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;color:#fff;font-family:Inter,system-ui,sans-serif">
        <div style="width:96px;height:96px;border-radius:24px;background:#fff;display:grid;place-items:center"><svg viewBox="21 19 58 58" width="70" height="70" aria-hidden="true"><path d="M33 60V44.5c0-1 .5-2 1.3-2.6L48 31.6a3.4 3.4 0 0 1 4 0l13.7 10.3c.8.6 1.3 1.6 1.3 2.6V61" fill="none" stroke="#2e3a8c" stroke-width="5.2" stroke-linejoin="round"/><path d="M50 37.8a7.4 7.4 0 0 0-7.4 7.4c0 5 7.4 13 7.4 13s7.4-8 7.4-13a7.4 7.4 0 0 0-7.4-7.4Zm0 4.6a2.8 2.8 0 1 1 0 5.6 2.8 2.8 0 0 1 0-5.6Z" fill="#2e3a8c"/><path d="M24 66.4C33 61 43 58.6 52 58.8c9 .2 17.4 3 23.6 7.4-8-2.4-16-3.8-24.4-3.8-9.2 0-18.4 1.4-27.2 4Z" fill="#2e3a8c"/></svg></div>
        <div style="font-size:28px;font-weight:600;letter-spacing:-0.02em">LandFinder</div>
        <div style="font-size:15px;font-weight:500;opacity:.85;letter-spacing:.01em">Find it. Trust it.</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
