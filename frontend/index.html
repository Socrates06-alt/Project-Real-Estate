<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="LandFinder — verified land, homes and commercial property." />
    <meta name="theme-color" content="#2e3a8c" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>LandFinder</title>
    <script>
      // Light by default; apply dark before the page paints if the user chose it.
      try {
        var t = localStorage.getItem("nilayam.theme");
        if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- Indigo splash: shown instantly, faded out once the app is ready -->
    <div id="splash" style="position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#2e3a8c;transition:opacity .35s ease">
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;color:#fff;font-family:Inter,system-ui,sans-serif">
        <svg viewBox="0 0 32 32" width="72" height="72" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#fff"/><path d="M8 15.5 16 9l8 6.5V24h-5.5v-5h-5v5H8z" fill="#2e3a8c"/></svg>
        <div style="font-size:28px;font-weight:600;letter-spacing:-0.02em">LandFinder</div>
        <div style="font-size:13px;opacity:.75">Verified land &amp; homes</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
